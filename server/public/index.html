<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE Attendance Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .stat-number {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .panel {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .log-entry {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }
        
        .log-entry:hover {
            transform: translateX(5px);
        }
        
        .log-entry.in {
            border-left-color: #28a745;
            background: #d4edda;
        }
        
        .log-entry.out {
            border-left-color: #dc3545;
            background: #f8d7da;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .token {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }
        
        .action {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        
        .action.in {
            background: #28a745;
            color: white;
        }
        
        .action.out {
            background: #dc3545;
            color: white;
        }
        
        .log-details {
            font-size: 0.9em;
            color: #666;
        }
        
        .timestamp {
            color: #999;
            font-size: 0.85em;
        }
        
        .device-status {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .device-status.present {
            background: #d4edda;
            border-left: 4px solid #28a745;
        }
        
        .device-status.absent {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .status-indicator.present {
            background: #28a745;
            box-shadow: 0 0 10px #28a745;
        }
        
        .status-indicator.absent {
            background: #dc3545;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-right: 10px;
        }
        
        .refresh-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .clear-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }
        
        .clear-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 53, 69, 0.6);
        }
        
        .btn-group {
            margin-bottom: 10px;
        }
        
        .auto-refresh {
            margin-top: 10px;
            color: #666;
            font-size: 0.9em;
        }
        
        .logs-container {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .logs-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .logs-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .logs-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 BLE Attendance Dashboard</h1>
            <p style="color: #666; margin-top: 10px;">Real-time monitoring of employee presence</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalLogs">0</div>
                <div class="stat-label">Total Events</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeDevices">0</div>
                <div class="stat-label">Active Devices</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="checkIns">0</div>
                <div class="stat-label">Check-ins</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="checkOuts">0</div>
                <div class="stat-label">Check-outs</div>
            </div>
        </div>
        
        <div class="content">
            <div class="panel">
                <h2>📊 Recent Activity</h2>
                <div class="btn-group">
                    <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
                    <button class="clear-btn" onclick="clearLogs()">🗑️ Clear Logs</button>
                </div>
                <div class="auto-refresh">Auto-refreshing every 5 seconds</div>
                <div class="logs-container" id="logsContainer">
                    <div class="empty-state">
                        <div>⏳</div>
                        <p>Loading activity...</p>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h2>👥 Device Status</h2>
                <div id="statusContainer">
                    <div class="empty-state">
                        <div>📱</div>
                        <p>No devices detected yet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                // Load logs
                const logsResponse = await fetch('/api/logs?limit=50');
                const logsData = await logsResponse.json();
                
                // Load status
                const statusResponse = await fetch('/api/status');
                const statusData = await statusResponse.json();
                
                // Update stats
                document.getElementById('totalLogs').textContent = logsData.total;
                document.getElementById('activeDevices').textContent = 
                    statusData.devices.filter(d => d.present).length;
                
                const checkIns = logsData.logs.filter(l => l.action === 'IN').length;
                const checkOuts = logsData.logs.filter(l => l.action === 'OUT').length;
                document.getElementById('checkIns').textContent = checkIns;
                document.getElementById('checkOuts').textContent = checkOuts;
                
                // Update logs
                const logsContainer = document.getElementById('logsContainer');
                if (logsData.logs.length === 0) {
                    logsContainer.innerHTML = '<div class="empty-state"><div>📭</div><p>No activity yet</p></div>';
                } else {
                    logsContainer.innerHTML = logsData.logs.map(log => {
                        const date = new Date(log.received_at);
                        return `
                            <div class="log-entry ${log.action.toLowerCase()}">
                                <div class="log-header">
                                    <span class="token">🔑 ${log.token}</span>
                                    <span class="action ${log.action.toLowerCase()}">${log.action}</span>
                                </div>
                                <div class="log-details">
                                    📡 ESP: ${log.esp_id}<br>
                                    <span class="timestamp">🕐 ${date.toLocaleString()}</span>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
                
                // Update status
                const statusContainer = document.getElementById('statusContainer');
                if (statusData.devices.length === 0) {
                    statusContainer.innerHTML = '<div class="empty-state"><div>📱</div><p>No devices detected yet</p></div>';
                } else {
                    statusContainer.innerHTML = statusData.devices.map(device => {
                        const lastSeen = new Date(device.lastSeen);
                        return `
                            <div class="device-status ${device.present ? 'present' : 'absent'}">
                                <div>
                                    <span class="status-indicator ${device.present ? 'present' : 'absent'}"></span>
                                    <strong>${device.token}</strong><br>
                                    <small style="color: #666;">ESP: ${device.esp_id}</small><br>
                                    <small style="color: #999;">Last seen: ${lastSeen.toLocaleString()}</small>
                                </div>
                                <div style="font-weight: bold; color: ${device.present ? '#28a745' : '#dc3545'}">
                                    ${device.present ? '✓ PRESENT' : '✗ ABSENT'}
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        async function clearLogs() {
            if (!confirm('Are you sure you want to clear all logs? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch('/api/clear', {
                    method: 'POST'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Logs cleared:', data);
                    
                    // Show success message
                    alert('✅ All logs cleared successfully!');
                    
                    // Reload data immediately
                    loadData();
                } else {
                    alert('❌ Failed to clear logs. Please try again.');
                }
            } catch (error) {
                console.error('Error clearing logs:', error);
                alert('❌ Error clearing logs. Please check the server.');
            }
        }
        
        // Load data immediately
        loadData();
        
        // Auto-refresh every 5 seconds
        setInterval(loadData, 5000);
    </script>
</body>
</html>
